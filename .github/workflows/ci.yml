# ==============================================================================
# OPTIONAL REFERENCE WORKFLOW ONLY
# NOTE: Primary enterprise CI/CD is implemented in Harness CI (.harness/pipeline.yaml)
# This file is provided purely as an optional comparison/reference.
# ==============================================================================

name: Optional Reference CI (Primary CI is Harness)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, Test & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Compile Application
        run: mvn clean compile -B

      - name: Run Unit Tests (Surefire)
        run: mvn test -B -Dnet.bytebuddy.experimental=true

      - name: Run Integration Tests (Failsafe)
        run: mvn verify -B -DskipUnitTests=true -Dnet.bytebuddy.experimental=true

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/

  docker-build-reference:
    name: Reference Docker Build
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Dry Run / No Push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: employee-service:${{ github.sha }}
