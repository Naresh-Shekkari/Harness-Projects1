server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: employee-service
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: Employee Management Service
    description: Production-style Spring Boot API for Harness CI Showcase
    version: 1.0.0-SNAPSHOT
    runtime: Java 25
